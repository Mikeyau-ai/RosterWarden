<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RosterWarden</title>
<meta name="description" content="Build a fair staff roster in seconds. Works offline, on your phone.">

<!-- Installable web app: these make "Add to Home Screen" behave like a real app. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RosterWarden">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Header: wordmark + which organisation you're working on -->
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <!-- Shield outline holding a tiny calendar -->
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8 3v5.8c0 5-3.4 8.6-8 10.2-4.6-1.6-8-5.2-8-10.2V5.5z"/><rect x="8" y="8.5" width="8" height="7" rx="1"/><path d="M8 11h8M10.5 13.2h.01M13.5 13.2h.01"/></svg>
      <span class="brand-name">RosterWarden</span>
    </div>
    <div class="org-switch">
      <select id="org-select" aria-label="Organisation"></select>
    </div>
  </div>
</header>

<!-- Navigation sits directly under the wordmark on wide screens; on a phone it
     is pinned to the bottom of the screen, within thumb reach. -->
<nav class="tabbar" aria-label="Sections">
  <button class="tab" data-view="roster" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7.5 14h4M7.5 17.5h9"/></svg>
    <span>Roster</span>
  </button>
  <button class="tab" data-view="new">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6.5"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M18 15v6M15 18h6"/></svg>
    <span>New Roster</span>
  </button>
  <button class="tab" data-view="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9L5.3 5.3"/></svg>
    <span>Settings</span>
  </button>
</nav>

<!-- Each view renders into this element; only one is shown at a time. -->
<main id="view" class="view" tabindex="-1"></main>

<!-- Transient confirmation messages -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Generic dialog host, filled by ui.js -->
<dialog id="modal" class="modal"></dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
